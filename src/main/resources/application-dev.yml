# 开发环境覆盖配置：只写与 application.yml 不同的部分
server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campus_market?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  configuration:
    # 开发期把 SQL 打到控制台，上线改成 Slf4jImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

file:
  upload-path: ./upload/
  access-prefix: /files/

logging:
  level:
    com.campus.market.mapper: debug
