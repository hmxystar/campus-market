server:
  port: 8080

spring:
  application:
    name: campus-market
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_market?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 20        # 连接池上限：并发高时别让数据库被压垮
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  servlet:
    multipart:
      max-file-size: 5MB           # 单文件上限，与全局异常里的提示保持一致
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # HS256 要求密钥至少 32 字节，课程里先用固定串，上线务必换成环境变量
  secret: campus-market-jwt-secret-key-must-be-32-bytes-at-least
  expire: 604800000                # 7 天（毫秒）

file:
  upload-path: ./upload/           # 本地图片落盘目录，需提前创建
  access-prefix: /files/           # 对外访问前缀，由 WebMvcConfig 映射

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.campus.market: info
    org.springframework.data.redis: info
