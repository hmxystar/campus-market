# 一套编排：MySQL + Redis + 后端 + Nginx
# 注意：已删掉废弃的 version 字段；Redis 用 8.10.3，MySQL 用 26.10（官方无该 tag 时退回 8.4 LTS）
services:
  mysql:
    image: mysql:26.10
    container_name: cm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: campus_market
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d   # 首次启动自动执行建表脚本
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.3
    container_name: cm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: cm-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/campus_market?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      # 关键：属性叫 spring.data.redis.host，环境变量必须是 SPRING_DATA_REDIS_HOST
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      FILE_UPLOAD_PATH: /app/upload/
      JWT_SECRET: campus-market-jwt-secret-key-must-be-32-bytes-at-least
    volumes:
      - ./upload:/app/upload
    expose:
      - "8080"

  nginx:
    image: nginx:1.28-alpine
    container_name: cm-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端产物目录，骨架阶段可先建空目录占位
      - ./campus-market-web/dist:/usr/share/nginx/html:ro
      - ./upload:/usr/share/nginx/html/files:ro
